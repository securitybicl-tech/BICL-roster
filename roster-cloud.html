<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">

<style>
/* Layout: control-room console. Sticky app bar + tab rail on top; dashboard is a main column with a right-hand alert rail; the roster is a full-width sticky-header grid; print views are fixed A4 sheets. */
:root{
  --bg:#e9edf1; --panel:#ffffff; --panel2:#f3f6f9; --ink:#14202b; --muted:#566574; --line:#d1d9e1;
  --brand:#0d5766; --brand-ink:#ffffff; --brand-soft:#d6ecf0;
  --crit:#d3212f; --crit-bg:#fde2e5; --warn:#a85f00; --warn-bg:#fff0cf; --ok:#17713f; --ok-bg:#dcf2e5;
  --j-bg:#e9e2f6; --j:#4a3578; --a-bg:#d6eafb; --a:#0a4875; --b-bg:#d4f0e0; --b:#14603a;
  --c-bg:#2a306d; --c:#ffffff; --r-bg:#e4e8ec; --r:#566574; --l-bg:#ffdfc4; --l:#8a4003;
  --k-bg:#fad5e2; --k:#951648; --x-bg:#e6d3c7; --x:#5a2c16; --o-bg:#d2ecf4; --o:#195870; --t-bg:#f0e3b8; --t:#6a5000;
  --head:"Anek Bangla","Hind Siliguri","Noto Sans Bengali","Nirmala UI",system-ui,sans-serif;
  --body:"Shonar Bangla","Hind Siliguri","Noto Sans Bengali","Nirmala UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --panel:#16202a; --panel2:#1b2733; --ink:#e5ecf2; --muted:#92a3b3; --line:#2b3948;
  --brand:#38aec4; --brand-ink:#06232a; --brand-soft:#12353e;
  --crit:#ff5a67; --crit-bg:#4a1a20; --warn:#f0b04c; --warn-bg:#40300f; --ok:#58cf8c; --ok-bg:#12382a;
  --j-bg:#2e2547; --j:#cdbcf5; --a-bg:#12354f; --a:#9fd2f7; --b-bg:#12392a; --b:#9ae0b8;
  --c-bg:#d9dcff; --c:#1a1f55; --r-bg:#26313c; --r:#9aabba; --l-bg:#4a2c12; --l:#ffc08a;
  --k-bg:#4a1c32; --k:#ffaecb; --x-bg:#40291c; --x:#e5b99f; --o-bg:#123b49; --o:#9ad6ea; --t-bg:#40350f; --t:#efd57c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --panel:#16202a; --panel2:#1b2733; --ink:#e5ecf2; --muted:#92a3b3; --line:#2b3948;
  --brand:#38aec4; --brand-ink:#06232a; --brand-soft:#12353e;
  --crit:#ff5a67; --crit-bg:#4a1a20; --warn:#f0b04c; --warn-bg:#40300f; --ok:#58cf8c; --ok-bg:#12382a;
  --j-bg:#2e2547; --j:#cdbcf5; --a-bg:#12354f; --a:#9fd2f7; --b-bg:#12392a; --b:#9ae0b8;
  --c-bg:#d9dcff; --c:#1a1f55; --r-bg:#26313c; --r:#9aabba; --l-bg:#4a2c12; --l:#ffc08a;
  --k-bg:#4a1c32; --k:#ffaecb; --x-bg:#40291c; --x:#e5b99f; --o-bg:#123b49; --o:#9ad6ea; --t-bg:#40350f; --t:#efd57c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--head);margin:0;text-wrap:balance}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.app{max-width:1500px;margin:0 auto;padding-bottom:48px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding:10px 0 6px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:13px;letter-spacing:.02em;flex:none}
.brand h1{font-size:18px;font-weight:700;line-height:1.15}
.brand small{display:block;color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{background:var(--panel2)}
.btn:focus-visible,.tab:focus-visible,.c:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.dirty{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:20px;padding:2px 10px;font-weight:600}
.saved{font-size:12px;color:var(--ok);background:var(--ok-bg);border-radius:20px;padding:2px 10px;font-weight:600}
input[type=text],input[type=date],input[type=month],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:14px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;cursor:pointer;white-space:nowrap;font-weight:500;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.panel h2{font-size:16px;font-weight:700;margin-bottom:8px}
.sub{color:var(--muted);font-size:12.5px}
.lbl{font-size:11.5px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--crit);color:#fff;border-radius:8px;padding:9px 14px;margin-bottom:12px;font-weight:600;animation:bflash 1.2s infinite}
.banner button{background:#fff;color:#a0111d;border:0;border-radius:6px;padding:4px 10px;font-weight:700;cursor:pointer}
@keyframes bflash{0%,100%{filter:none}50%{filter:brightness(.78)}}
@keyframes flash{0%,100%{background:var(--crit-bg);color:var(--crit)}50%{background:var(--crit);color:#fff}}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--brand)}100%{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion:reduce){.banner,.c.crit,.c.ping{animation:none!important}.c.crit{background:var(--crit)!important;color:#fff!important}}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:26px;padding:1px 8px;border-radius:5px;font-weight:700;font-size:12.5px}
.sh-j{background:var(--j-bg);color:var(--j)}.sh-a{background:var(--a-bg);color:var(--a)}.sh-b{background:var(--b-bg);color:var(--b)}
.sh-c{background:var(--c-bg);color:var(--c)}.sh-r{background:var(--r-bg);color:var(--r)}.sh-l{background:var(--l-bg);color:var(--l)}
.sh-k{background:var(--k-bg);color:var(--k)}.sh-x{background:var(--x-bg);color:var(--x)}.sh-o{background:var(--o-bg);color:var(--o)}.sh-t{background:var(--t-bg);color:var(--t)}
table.g td.sh-j{background:var(--j-bg);color:var(--j)}table.g td.sh-a{background:var(--a-bg);color:var(--a)}table.g td.sh-b{background:var(--b-bg);color:var(--b)}table.g td.sh-c{background:var(--c-bg);color:var(--c)}table.g td.sh-r{background:var(--r-bg);color:var(--r)}table.g td.sh-l{background:var(--l-bg);color:var(--l)}table.g td.sh-k{background:var(--k-bg);color:var(--k)}table.g td.sh-x{background:var(--x-bg);color:var(--x)}table.g td.sh-o{background:var(--o-bg);color:var(--o)}table.g td.sh-t{background:var(--t-bg);color:var(--t)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2)}
.kpi b{display:block;font-family:var(--head);font-size:24px;line-height:1.1;font-weight:700}
.kpi span{font-size:12px;color:var(--muted)}
.bar2{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.bar2>i{display:block;height:100%;background:var(--ok)}
.bar2.short>i{background:var(--crit)}.bar2.over>i{background:var(--warn)}
.slot{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px}
.slot:last-child{border-bottom:0}
.slot em{font-style:normal;color:var(--muted);font-size:12px}
.vac{color:var(--crit);font-weight:700}
.plab{padding:0 8px;border-radius:4px;font-weight:600;font-size:12.5px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.dt{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:3px 0;text-align:center;cursor:pointer;line-height:1.2;font-size:12px}
.dt b{display:block;font-size:14px}
.dt.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.dt.w{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.dt.x{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.dt.sel{outline:3px solid var(--brand);outline-offset:1px}
.alist{max-height:560px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.al{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;background:var(--panel2)}
.al.crit{border-color:var(--crit);background:var(--crit-bg)}.al.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:var(--warn-bg)}
.al .t{flex:1;min-width:0}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:2px 10px;cursor:pointer;font-size:12.5px}
.fchip[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
/* roster grid */
.gwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:calc(100vh - 210px);min-height:320px}
table.g{border-collapse:separate;border-spacing:0;font-size:12px}
table.g th,table.g td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;background:var(--panel)}
table.g thead th{position:sticky;top:0;z-index:3;background:var(--panel2);font-weight:600;height:24px}
table.g thead tr.r2 th{top:24px;font-weight:500;color:var(--muted);font-size:11px;height:18px}
table.g thead tr.r3 th{top:42px;font-size:11px;height:18px;font-weight:500}
table.g .stk{position:sticky;z-index:4;background:var(--panel2);text-align:left;padding:0 6px}
table.g thead .stk{z-index:6}
table.g .s1{left:0;min-width:78px;width:78px}
table.g .s2{left:78px;min-width:120px;width:120px;border-right:2px solid var(--line)}
td.c{min-width:30px;height:26px;cursor:pointer;font-weight:600;user-select:none}
td.c.po{min-width:38px;font-weight:600;font-size:11.5px;color:var(--muted)}
td.c.po[class*="sh-"]{filter:saturate(.9)}
td.c.po.auto{font-style:italic;opacity:.75}
td.c.po.cmd{font-weight:800}
td.c:hover{box-shadow:inset 0 0 0 2px var(--brand)}
td.c.crit{animation:flash 1.1s infinite;font-weight:800}
td.c.warn{box-shadow:inset 0 0 0 2px var(--warn);background-image:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--warn) 28%,transparent) 4px 8px)}
td.c.ping{animation:ping 1s 3}
table.g th.sel,table.g td.selc{outline:0;box-shadow:inset 0 -2px 0 var(--brand)}
table.g thead th.sel{background:var(--brand-soft);color:var(--brand)}
table.g tfoot td,table.g tfoot th{background:var(--panel2);font-weight:600;position:static}
table.g tfoot .stk{z-index:4}
td.under{background:var(--crit-bg)!important;color:var(--crit)}
td.over{background:var(--warn-bg)!important;color:var(--warn)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:3px}
.dot.x{background:var(--crit)}.dot.w{background:var(--warn)}
.menu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:8px;max-width:330px;max-height:70vh;overflow:auto}
.menu .ttl{font-size:12px;color:var(--muted);margin-bottom:6px}
.menu .opts{display:flex;flex-wrap:wrap;gap:4px}
.menu .opt{border:1px solid var(--line);background:var(--panel2);border-radius:5px;padding:3px 9px;cursor:pointer;min-width:34px;font-weight:600}
.menu .opt:hover{outline:2px solid var(--brand)}
.menu .opt.cur{outline:2px solid var(--brand)}
.menu .opt.gate1{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.menu .opt.gate2{background:var(--j-bg);color:var(--j);border:2px solid var(--j)}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle}
table.t th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel2)}
.tw{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-weight:600;max-width:90vw}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal>div{background:var(--panel);border-radius:10px;padding:18px;max-width:420px;width:100%;border:1px solid var(--line)}
.preview{overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px}

:root{--bd:var(--line);--mu:var(--muted);--card:var(--panel);--tx:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
#view>.card,#view>.panel{margin-bottom:12px}
input:not([type=checkbox]):not([type=radio]),select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:0}
.btn.grn{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.red{background:var(--crit);color:#fff;border-color:var(--crit)}
.pt{border-collapse:collapse;width:100%}.pt th,.pt td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle}.pt th{font-size:12px;color:var(--muted);background:var(--panel2)}
.mwrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
.badge{display:inline-block;border-radius:999px;padding:0 8px;font-size:12px;color:#fff}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-weight:600;opacity:0;transition:.3s;z-index:99;pointer-events:none}#toast.on{opacity:1}
td.c.dup{outline:2px dashed var(--j);outline-offset:-2px}
table.g tr.pin td{position:sticky;top:42px;z-index:2;box-shadow:inset 0 -2px 0 var(--brand)}table.g tr.pin td.stk{z-index:5}
.gwrap{max-height:calc(100vh - 250px)}
.sheet{background:#fff;color:#000;padding:10px;border:1px solid var(--line);max-width:210mm;margin:auto;font-size:11px;font-family:"Shonar Bangla","Hind Siliguri","Noto Sans Bengali",sans-serif;box-shadow:0 2px 14px rgba(0,0,0,.2)}
.sh{width:100%;table-layout:fixed;border-collapse:collapse}.sh td,.sh th{border:1px solid #000;padding:1px 3px;text-align:left;vertical-align:middle;word-break:break-word;color:#000}
.sh th{font-weight:600;text-align:center;background:#fff}.sh .c{text-align:center}.sh .ttl{font-size:16px;font-weight:700;text-align:center}.sh .ttl2{font-size:13px;font-weight:700;text-align:center}
.sh tr.nb td{border:0}.lw{margin-bottom:6px}
.sheet,.sheet *{font-family:"Shonar Bangla","SolaimanLipi","Noto Sans Bengali","Hind Siliguri",sans-serif!important;font-size:11pt!important}
.sheet .ttl{font-size:16pt!important;line-height:1.3}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100}#dlg[hidden]{display:none}
.dlgbox{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:560px;width:92%;max-height:90vh;overflow:auto}
.cs-ok{color:var(--ok)}.cs-err{color:var(--crit)}
@media print{
 body *{visibility:hidden}.noprint,.bar,.tabs,#menu{display:none!important}
 .pm-s .sheet,.pm-s .sheet *{visibility:visible}.pm-s .sheet{position:absolute;left:0;top:0;width:100%;border:0;padding:0;max-width:none;box-shadow:none}
 .pm-month #monthPrint,.pm-month #monthPrint *{visibility:visible}.pm-month #monthPrint{position:absolute;left:0;top:0}
 .pm-month .gwrap{max-height:none;overflow:visible;border:0}.pm-month table.g .stk,.pm-month table.g thead th,.pm-month table.g tr.pin td{position:static}
 body{background:#fff!important;padding:0!important}
 .pm-month table.g th,.pm-month table.g td,.pm-month #monthPrint{font-family:"Shonar Bangla","SolaimanLipi","Noto Sans Bengali",sans-serif;font-size:11pt}
 td.c.crit{animation:none!important;background:#d3212f!important;color:#fff!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

<body>
<div class="app" id="app">
 <header class="bar noprint"><div class="brand"><div class="logo">BIC</div><div><h1>নিরাপত্তা শাখার ডিউটি রোস্টার ম্যানেজমেন্ট সিস্টেম</h1><small>বসুন্ধরা ইন্ডাস্ট্রিয়াল কমপ্লেক্স লিমিটেড, মদনগঞ্জ</small></div></div><div class="flex flex-wrap items-center gap-2" id="barctl"></div></header>
 <div id="banner" class="noprint"></div><nav class="tabs noprint" id="tabs" role="tablist"></nav><main id="view"></main>
</div>

/* ===================== ক্লাউড সিঙ্ক (Firebase Realtime Database — REST, কোনো লাইব্রেরি লাগে না) ===================== */
const CLOUD_DEFAULT={url:'',key:''}; /* চাইলে এখানে আপনার Database URL ও কী বসিয়ে রাখতে পারেন */
const CK='bic_cloud_cfg',PK='bic_cloud_pending';
let CFG={};try{CFG=JSON.parse(localStorage.getItem(CK))||{}}catch(e){}
const b64u=x=>btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=x=>{x=x.replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';return atob(x)};
function parseShare(str){try{str=String(str).trim();const m=str.match(/[?#&]c=([^&#\s]+)/);let c=m?m[1]:str;try{c=decodeURIComponent(c)}catch(e){}const o=JSON.parse(unb64u(c.replace(/\s/g,'')));if(o.u&&o.k)return{url:o.u,key:o.k}}catch(e){}return null}
let JOINED=false;
try{const q=location.search+location.hash;if(/[?#&]c=/.test(q)){const j=parseShare(q);if(j){CFG=j;localStorage.setItem(CK,JSON.stringify(CFG));JOINED=true}try{history.replaceState(null,'',location.pathname)}catch(e){}}}catch(e){}
if(!CFG.url&&CLOUD_DEFAULT.url)CFG=Object.assign({},CLOUD_DEFAULT);
const cloudOn=()=>!!(CFG.url&&CFG.key);
let cs={state:cloudOn()?'connecting':'off',es:null,sent:{},pending:new Set(),fly:new Set(),timer:null,ready:false,defer:false};
try{(JSON.parse(localStorage.getItem(PK))||[]).forEach(x=>cs.pending.add(x))}catch(e){}
const savePend=()=>{try{localStorage.setItem(PK,JSON.stringify([...cs.pending]))}catch(e){}};
const cbase=()=>CFG.url.replace(/\/+$/,'')+'/rosters/'+encodeURIComponent(CFG.key);
const CL={off:'ক্লাউড সিঙ্ক বন্ধ',connecting:'সংযোগ হচ্ছে…',syncing:'সিঙ্ক হচ্ছে…',ok:'ক্লাউডে সিঙ্কড ✓',offline:'অফলাইন',err:'সিঙ্ক ত্রুটি'};
function cloudLabel(){return '☁ '+CL[cs.state]}
function setCS(s){cs.state=s;const b=$('cloudBtn');if(b){b.textContent=cloudLabel();b.className='btn '+(s==='ok'?'cs-ok':s==='err'||s==='offline'?'cs-err':'')}}
function chunks(){const c={},meta=Object.assign({},S);delete meta.months;c.meta=JSON.stringify(meta);Object.keys(S.months).forEach(k=>c['m:'+k]=JSON.stringify(S.months[k]));return c}
function queueCloud(){if(!cloudOn()||!cs.ready)return;clearTimeout(cs.timer);cs.timer=setTimeout(()=>pushCloud(),700)}
async function putChunk(n,v){cs.pending.add(n);cs.fly.add(n);savePend();let r;try{r=await fetch(cbase()+'/'+(n==='meta'?'meta':'months/'+n.slice(2))+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)})}finally{cs.fly.delete(n)}if(!r.ok)throw new Error('HTTP '+r.status);cs.sent[n]=v;cs.pending.delete(n);savePend();if(chunks()[n]!==v)queueCloud()}
async function pushCloud(force){if(!cloudOn())return;const c=chunks(),jobs=[];for(const[n,v]of Object.entries(c))if(!cs.fly.has(n)&&(force||cs.sent[n]!==v))jobs.push(putChunk(n,v));if(!jobs.length)return;setCS('syncing');try{await Promise.all(jobs);setCS('ok')}catch(e){setCS(navigator.onLine===false?'offline':'err')}}
function applyRemote(path,data){const parts=path.split('/').filter(Boolean);let changed=false;
 const setChunk=(n,str)=>{if(typeof str!=='string'||cs.pending.has(n))return;cs.sent[n]=str;if(chunks()[n]===str)return;try{const o=JSON.parse(str);if(n==='meta'){const mo=S.months;S=Object.assign({},o,{months:mo})}else S.months[n.slice(2)]=o;changed=true}catch(e){}};
 if(!parts.length){if(data&&typeof data==='object'){if(data.meta!==undefined)setChunk('meta',data.meta);Object.entries(data.months||{}).forEach(([k,v])=>setChunk('m:'+k,v))}}
 else if(parts[0]==='meta')setChunk('meta',data);
 else if(parts[0]==='months'){if(parts.length===1&&data&&typeof data==='object')Object.entries(data).forEach(([k,v])=>setChunk('m:'+k,v));else if(parts.length===2)setChunk('m:'+parts[1],data)}
 if(changed){migrate();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))cs.defer=true;else render();toast('☁ অন্য ডিভাইস থেকে আপডেট এসেছে')}}
function disconnectCloud(){if(cs.es){cs.es.close();cs.es=null}}
function connectCloud(){disconnectCloud();cs.ready=false;if(!cloudOn()){setCS('off');return}setCS('connecting');
 try{const es=new EventSource(cbase()+'.json');cs.es=es;
  es.addEventListener('put',e=>{const m=JSON.parse(e.data);if(m.path==='/'&&m.data===null){cs.ready=true;pushCloud(true)}else{const first=!cs.ready;applyRemote(m.path,m.data);cs.ready=true;setCS('ok');if(first)pushCloud()}});
  es.addEventListener('patch',e=>{const m=JSON.parse(e.data);if(m.path==='/'&&m.data)Object.entries(m.data).forEach(([k,v])=>applyRemote('/'+k,v));else applyRemote(m.path,m.data)});
  es.addEventListener('cancel',()=>setCS('err'));es.addEventListener('auth_revoked',()=>setCS('err'));
  es.onopen=()=>{if(cs.state!=='syncing')setCS('ok')};es.onerror=()=>setCS(navigator.onLine===false?'offline':'connecting')}catch(e){setCS('err')}}
window.addEventListener('online',()=>{if(cloudOn()){connectCloud()}});
window.addEventListener('offline',()=>{if(cloudOn())setCS('offline')});
document.addEventListener('focusout',()=>{if(cs.defer){cs.defer=false;setTimeout(render,60)}});
function openDlg(){const d=$('dlg');d.hidden=false;d.innerHTML=`<div class="dlgbox"><h2>☁ ক্লাউড সিঙ্ক সেটিংস (Firebase)</h2><p class="sub">সব ডিভাইসে একই Database URL ও ওয়ার্কস্পেস কী দিলে সবখানে একই রোস্টার দেখাবে। অবস্থা: <b>${CL[cs.state]}</b></p>
 <label class="lbl">Firebase Database URL</label><input id="cUrl" class="w-full" placeholder="https://আপনার-প্রজেক্ট-default-rtdb.firebaseio.com" value="${CFG.url||''}">
 <label class="lbl mt-2">ওয়ার্কস্পেস কী (পাসওয়ার্ডের মতো গোপন রাখুন)</label><div class="flex gap-1"><input id="cKey" class="w-full" value="${CFG.key||''}"><button class="btn" id="cGen">নতুন কী</button></div>
 <div class="flex flex-wrap gap-2 mt-3"><button class="btn pri" id="cSave">সংযুক্ত করুন</button><button class="btn" id="cOff">বিচ্ছিন্ন করুন</button><button class="btn" id="cLink">🔗 অন্য ডিভাইসের লিংক কপি</button></div>
 <label class="lbl mt-3">অন্য ডিভাইসে যুক্ত করতে: সংযোগ কোড বা লিংক পেস্ট করুন</label><div class="flex gap-1"><input id="cPaste" class="w-full" placeholder="কোড/লিংক এখানে পেস্ট করুন"><button class="btn pri" id="cJoin">যুক্ত করুন</button></div>
 <label class="lbl mt-2">এই ডিভাইসের সংযোগ কোড (অন্য ডিভাইসে পেস্ট করার জন্য)</label><div class="flex gap-1"><input id="cCode" class="w-full" readonly value="${cloudOn()?b64u(JSON.stringify({u:CFG.url,k:CFG.key})):''}"><button class="btn" id="cCopyCode">কোড কপি</button></div>
 <div class="flex flex-wrap gap-2 mt-2"><button class="btn" id="cUp">⬆ এই ডিভাইসের ডেটা ক্লাউডে ওভাররাইট</button><button class="btn" id="cDown">⬇ ক্লাউড থেকে ডেটা নামান</button></div>
 <p class="sub mt-2">নতুন ডিভাইসে প্রথমবার সংযুক্ত করলে ক্লাউডে ডেটা থাকলে সেটাই লোড হয়; ক্লাউড ফাঁকা থাকলে এই ডিভাইসের ডেটা আপলোড হয়।</p><div class="mt-3 text-right"><button class="btn" id="cClose">বন্ধ</button></div></div>`}
const closeDlg=()=>{$('dlg').hidden=true;$('dlg').innerHTML=''};
document.addEventListener('click',async e=>{const t=e.target;
 if(t.id==='cloudBtn')openDlg();else if(t.id==='dlg'||t.id==='cClose')closeDlg();
 else if(t.id==='cGen'){const a=new Uint8Array(18);crypto.getRandomValues(a);$('cKey').value=[...a].map(x=>'abcdefghijkmnpqrstuvwxyz23456789'[x%32]).join('')}
 else if(t.id==='cSave'){const u=$('cUrl').value.trim(),k=$('cKey').value.trim();if(!/^https:\/\/.+/.test(u)||k.length<8){toast('সঠিক URL এবং কমপক্ষে ৮ অক্ষরের কী দিন');return}CFG={url:u,key:k};try{localStorage.setItem(CK,JSON.stringify(CFG))}catch(x){}cs.sent={};connectCloud();closeDlg()}
 else if(t.id==='cJoin'){const j=parseShare($('cPaste').value);if(!j){toast('কোডটি বোঝা যায়নি — পুরো কোড/লিংক পেস্ট করুন');return}CFG=j;try{localStorage.setItem(CK,JSON.stringify(CFG))}catch(x){}cs.sent={};connectCloud();closeDlg();toast('☁ সংযুক্ত হচ্ছে…')}
 else if(t.id==='cCopyCode'){const v=$('cCode').value;if(!v){toast('আগে সংযুক্ত করুন');return}try{await navigator.clipboard.writeText(v);toast('কোড কপি হয়েছে')}catch(x){prompt('কোডটি কপি করুন',v)}}
 else if(t.id==='cOff'){CFG={};try{localStorage.removeItem(CK)}catch(x){}disconnectCloud();setCS('off');closeDlg()}
 else if(t.id==='cLink'){if(!cloudOn()){toast('আগে সংযুক্ত করুন');return}const l=location.origin+location.pathname+'?c='+b64u(JSON.stringify({u:CFG.url,k:CFG.key}));try{await navigator.clipboard.writeText(l);toast('লিংক কপি হয়েছে')}catch(x){prompt('লিংকটি কপি করুন',l)}}
 else if(t.id==='cUp'){if(cloudOn()&&confirm('ক্লাউডের ডেটা মুছে এই ডিভাইসের ডেটা দিয়ে ওভাররাইট হবে। নিশ্চিত?')){cs.ready=true;await pushCloud(true);closeDlg()}}
 else if(t.id==='cDown'){if(cloudOn()&&confirm('এই ডিভাইসের ডেটা মুছে ক্লাউডের ডেটা বসবে। নিশ্চিত?')){try{const r=await fetch(cbase()+'.json'),d=await r.json();if(!d){toast('ক্লাউডে কোনো ডেটা নেই');return}cs.pending.clear();savePend();cs.sent={};applyRemote('/',d);render();closeDlg()}catch(x){toast('ডাউনলোড ব্যর্থ')}}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('dlg').hidden)closeDlg()});
connectCloud();
render();
if(JOINED)setTimeout(()=>toast('☁ সংযোগ সেটিংস পাওয়া গেছে — সিঙ্ক শুরু হচ্ছে'),700);
</script>
